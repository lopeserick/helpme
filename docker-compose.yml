# PostgreSQL para desenvolvimento. Subir com: docker compose up -d
#
# A versão aqui deve ser a mesma que roda no servidor da empresa. Ajuste a
# tag quando essa informação estiver confirmada.
services:
  banco:
    image: postgres:16
    container_name: helpme-banco
    environment:
      POSTGRES_USER: helpme
      POSTGRES_PASSWORD: helpme
      POSTGRES_DB: helpme
    ports:
      - '5432:5432'
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpme -d helpme']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados-banco:
